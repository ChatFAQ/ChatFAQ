[tool.poetry]
name = "chatfaq_sdk"
version = "0.1.58"
description = "ChatFAQ SDK"
authors = ["Hector Soria <hector.soria@with-madrid.com>"]
readme = "README.md"

packages = [
    { include = "chatfaq_sdk" },
]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
websockets = "^17.4"
coloredlogs = "^15.0.1"
python-dotenv = "^1.2.4"
requests = "^2.34.2"
certifi = "^2026.11.20"
urllib3 = "^2.8.0"
httpx = "^0.28.1"
pydantic = "^2.14.4"
sentry-sdk = "^2.76.0"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"

[tool.isort]
profile = "black"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
